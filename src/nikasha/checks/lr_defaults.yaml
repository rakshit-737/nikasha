#
# Initial per-(check, outcome) strengths: natural-log likelihood ratios (SPEC §12, §14.1).
# These are *priors*, replaced by calibration-vN.yaml once NikashaBench has enough labelled
# reports (SPEC §14.2). Never tune them to make a fixture pass.
#
# Scale: refutations strong -3.0, moderate -1.2, weak -0.4;
#        support weak +0.4, moderate +1.0, strong +2.0; decisive +6.0.
version: 1

