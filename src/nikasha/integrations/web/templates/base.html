<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="generator" content="nikasha">
<title>{% block title %}Nikasha{% endblock %}</title>
<link rel="stylesheet" href="{{ href('/static/ui.css') }}">
<script src="{{ href('/static/ui.js') }}" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
<header class="topbar">
  <a class="brand" href="{{ href('/') }}">Nikasha</a>
  <nav aria-label="Pages">
    <a href="{{ href('/') }}"{% if page == 'new' %} aria-current="page"{% endif %}>New check</a>
    <a href="{{ href('/history') }}"{% if page == 'history' %} aria-current="page"{% endif %}>History</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted">v{{ tool_version }} &middot; this machine only</span>
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
</div>
</body>
</html>
