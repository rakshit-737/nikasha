{% extends "base.html" %}
{% block title %}{{ title }} &middot; Nikasha{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<section class="panel notice error" role="alert">

  <p class="muted">HTTP {{ code }}</p>
</section>
<p><a href="{{ href('/') }}">Back to New check</a></p>
{% endblock %}
