#
# Commit plan for the vulnlab demo repository (libhdr).
#
# scripts/build_vulnlab.py replays these commits, in order, onto the branch
# "main" of a fresh bare repository via `git fast-import`. Author, committer,
# dates and messages are fixed here so the resulting commit SHAs are identical
# on every machine. "tree" names a directory under examples/vulnlab/src/ whose
# complete contents are snapshotted for that commit; the builder additionally
# injects the Apache-2.0 licence text as LICENSE at every commit. "tag", when
# present, creates a lightweight tag pointing at that commit.

branch = "main"
author = "Vulnlab Maintainers <vulnlab@example.invalid>"

