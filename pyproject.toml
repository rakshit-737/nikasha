[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nikasha"
dynamic = ["version"]
description = "Proof, not prose. Fact-check vulnerability reports against the real code at the exact version they name."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [{ name = "Rakshit Rameshbabu", email = "rakshitoffl@gmail.com" }]
keywords = [
  "security",
  "vulnerability",
  "triage",
  "cve",
  "bug-bounty",
  "tree-sitter",
  "sanitizers",
  "ai-slop",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2",
    "platformdirs>=4.11.12",
    "pydantic>=2.13.5",
    "pygments>=2.19",
    "pyyaml>=6",
    "rapidfuzz>=3.14",
    "rich>=15.0.0",
    "tree-sitter>=0.26",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.2",
    "unidiff>=1.0.1",
]

[project.optional-dependencies]
# Extras are filled in by the milestone that first needs them (ADR 0002).
web = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]
mcp = [
    "mcp>=2.2,<3",
]
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
]
bench = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
nikasha = "nikasha.cli:main"

[project.urls]
Homepage = "https://github.com/rakshit-737/nikasha"
Source = "https://github.com/rakshit-737/nikasha"
Issues = "https://github.com/rakshit-737/nikasha/issues"
Changelog = "https://github.com/rakshit-737/nikasha/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/nikasha/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nikasha"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "schema/",
  "tests/",
  "LICENSE",
  "NOTICE",
  "LICENSES/",
  "README.md",
  "CHANGELOG.md",
  "CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Fixture programs deliberately misbehave (their tracebacks are the fixtures).
extend-exclude = ["tests/fixtures"]
# Apply the excludes even to files named on the command line (pre-commit passes file names).
force-exclude = true

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N", "C4", "PL", "T20", "TID", "ANN",
]
ignore = [
  "PLR0913", # CLI entry points legitimately take many options
  "SIM905",  # "a b c".split() keeps long word lists readable
]

[tool.ruff.lint.per-file-ignores]
# The subprocess ban (TID251) guards the product code in src/; dev scripts and tests drive
# git and podman directly. S108: /tmp paths in tests are test data.
"tests/**" = ["S101", "S105", "S108", "ANN", "PLR2004", "TID251", "S603", "S607"]
"scripts/**" = ["T20", "TID251", "S603", "S607"]
# The capture table is data (one fixture per row); /tmp there is a path inside the container.
"scripts/capture_trace_fixtures.py" = ["E501", "S108"]
# The only two modules allowed to spawn processes (enforced again by tests/unit/test_process_boundary.py).
"src/nikasha/code/gitio.py" = ["TID251", "S603"]
"src/nikasha/repro/sandbox.py" = ["TID251", "S603"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Run external programs only through nikasha.code.gitio or nikasha.repro.sandbox."

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
warn_unreachable = true

# The [bench] extra is imported lazily through importlib, so no typed code depends on it.
# numpy's stubs (reached through rapidfuzz's) use the 3.12 `type` statement, which mypy
# rejects at python_version 3.11.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "sklearn", "sklearn.*", "matplotlib", "matplotlib.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not sandbox and not network and not slow"]
markers = [
  "sandbox: needs a container engine (podman or docker); CI runs these on ubuntu",
  "network: needs network access; nightly only",
  "slow: long-running tests",
]
xfail_strict = true

[tool.coverage.run]
source = ["nikasha"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.codespell]
skip = "*.lock,*.svg,LICENSES/*,.git,.venv,SPEC.md,*/fixtures/tags/*,./site,./bench/cache"
ignore-words-list = "nd,cna"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "packaging>=26.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
