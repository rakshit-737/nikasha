# Categories for GitHub's automatically generated release notes.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, false-verdict]
    - title: Checks
      labels: [checks]
    - title: Recipes
      labels: [recipe]
    - title: Docs
      labels: [documentation]
    - title: Maintenance
      labels: ["*"]
