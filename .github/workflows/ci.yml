#
# The quality gates every change must pass (SPEC §20.3). Actions are pinned by full commit
# SHA (resolved with `gh api` on 2026-09-23); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.18"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint, types, licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-groups
      - run: make lint
      - run: make type

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-groups
      - run: uv run pytest --cov --cov-report=term
      - name: Coverage gate on the core packages (SPEC §20.3)
        run: >-
          uv run coverage report --skip-covered --fail-under=85
          --include="src/nikasha/extract/*,src/nikasha/code/*,src/nikasha/ingest/*,src/nikasha/model/*"
      - name: CLI smoke test
        run: |
          uv run nikasha version
          uv run nikasha doctor
          uv run nikasha extract examples/reports/fabricated_hdr_overflow.md --json

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI image, pinned by digest, scanning the full history. gitleaks-action v3
      # scans only the pushed range as `<first>^..<last>`, which fails on a root commit.
      - name: gitleaks (full history)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --exit-code 1 /repo

  dco:
    name: DCO sign-off and Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            # Bot commits (e.g. Dependabot) cannot sign off; they are reviewed by a maintainer instead.
            case "$(git log -1 --format=%ae "$sha")" in
              *"[bot]@users.noreply.github.com") continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | python3 scripts/check_commit_msg.py --stdin; then
              echo "::error::commit $sha fails the commit-message check"
              status=1
            fi
          done
          exit "$status"
