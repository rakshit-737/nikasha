#
# Regenerate every README and docs image from real runs (SPEC §21.5) on a clean ubuntu
# runner, the source of truth for media, and open a pull request with the result. Never
# hand-edit screenshots. Actions are pinned by full commit SHA (resolved with `gh api` on
# 2026-09-24). Opening the PR needs the repository setting "Allow GitHub
# Actions to create and approve pull requests"; a PR opened with GITHUB_TOKEN does not
# trigger CI, so a maintainer must re-run CI on it (close and reopen, or push). The VHS demo GIF joins this job when `make demo` lands.
name: Screenshots

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: screenshots
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.18"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  screenshots:
    name: Regenerate media and open a PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-groups
      - name: Install Playwright and Chromium
        run: |
          uv pip install "playwright==${PLAYWRIGHT_VERSION}"
          uv run playwright install --with-deps chromium
      - run: make screenshots
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/screenshots
          delete-branch: true
          commit-message: "docs: regenerate screenshots from real runs"
          title: "docs: regenerate screenshots from real runs"
          body: |
            Regenerated by `make screenshots` in the Screenshots workflow (SPEC §21.5).
            Every image comes from a real run against vulnlab; review the diff visually.
          signoff: true
          add-paths: docs/assets/**
