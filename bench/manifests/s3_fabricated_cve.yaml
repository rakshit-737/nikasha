# S3 (SPEC 17.2): the CVE IDs from JFrog Security Research, "SQLite Critical CVEs or LLM
# Slop?" (https://research.jfrog.com/post/sqlite-critical-cves-or-llm-slops/, published
# 2026-07-30), with content to come from cvelistV5. IDs, commits and labels only; never record text.
#
# The post names six SQLite CVEs. All six were REJECTED in cvelistV5 on 2026-07-31 (commit
# 6a1b7cf5), and the current records hold only the "DO NOT USE THIS CVE RECORD" text. Their
# pre-rejection records still exist in cvelistV5's git history, and the maintainer decided
# (2026-09-26, ADR 0011 addendum) that S3 uses them: each entry is pinned to the last commit
# that touched its file before the rejection. The post mentions about 55 more advisories from
# the same account but names no other IDs. Only the ID and commit SHA are committed; the JSON
# is fetched by `nikasha bench fetch-cvelist --online` into the gitignored bench/cache/.
